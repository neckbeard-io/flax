name: Format

# Fails when Dart source is not `dart format` clean, so the baseline adopted in
# #19 cannot quietly drift back. Deliberately separate from release.yml, which
# is manual and opt-in per platform: this one has to fire on its own to be worth
# anything, so it is kept as cheap as it can be.
#
# Ubuntu only (1x billing multiplier), and it installs the Dart SDK rather than
# Flutter — `dart format` needs no Flutter toolchain, no pub get, and no build.
# The whole run is a checkout, an SDK, and a formatter pass.
#
# The three numeric tables in the equalizer are fenced with
# `// dart format off`, which the formatter honors, so this check passes with
# them laid out as grids. That marker must read exactly `// dart format off`
# with nothing appended to the line, or the formatter ignores it and this job
# starts failing on a table that looks correct.
#
# Reproduce a failure locally with the same command:
#
#   dart format --output=none --set-exit-if-changed .
#
# and fix it with `dart format .`.

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the earlier run irrelevant; don't pay
# for both.
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, because formatter output is a property of the SDK version — a
      # newer Dart can restyle code this one considers clean, which would fail
      # the check on an untouched file. Keep in step with FLUTTER_VERSION in
      # release.yml (Flutter 3.44.2 ships Dart 3.12.2); bumping one means
      # re-running `dart format .` and committing the result.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      # --output=none writes nothing; --set-exit-if-changed is what makes an
      # unformatted file a failure rather than a silent rewrite. The names of
      # the offending files are printed above the failure.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
