name: Release

# Automated & manual release builds across macOS, Windows, Linux, and Android.
#
# Triggers:
# 1. Push to dev: Auto-publishes a pre-release (vX.Y.Z-dev.N) to the Dev update channel.
# 2. Push to main: Auto-publishes an official release (vX.Y.Z) to the Stable update channel.
# 3. workflow_dispatch: Manual triggers for specific platforms or custom version tags.
#
# Rapid pushes automatically cancel in-progress runs on that branch to save runner resources.

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, without the leading v (e.g. 0.5.7 or 0.5.7-dev.1). Leave empty to auto-detect.'
        required: false
        type: string
      channel:
        description: 'Release channel (stable or dev). Auto-detected if omitted.'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - dev
      macos:
        description: 'Build macOS .dmg'
        required: false
        default: true
        type: boolean
      windows:
        description: 'Build Windows installer (.exe) & portable (.zip)'
        required: false
        default: true
        type: boolean
      android:
        description: 'Build Android .apk'
        required: false
        default: true
        type: boolean
      linux:
        description: 'Build Linux packages (.deb, .rpm, .tar.gz)'
        required: false
        default: true
        type: boolean
      publish:
        description: 'Create the tag + GitHub Release from whatever was built'
        required: false
        default: true
        type: boolean

permissions:
  contents: write # create the tag, the Release, and upload assets

# Cancels any in-progress build on the same branch if a new commit is pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.2

jobs:
  setup:
    name: Resolve Version & Configuration
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      macos: ${{ steps.resolve.outputs.macos }}
      windows: ${{ steps.resolve.outputs.windows }}
      linux: ${{ steps.resolve.outputs.linux }}
      android: ${{ steps.resolve.outputs.android }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        name: Determine version and release channel
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          ref_name = os.environ.get('GITHUB_REF_NAME', '')
          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          input_version = "${{ inputs.version }}".strip()
          input_channel = "${{ inputs.channel }}".strip()

          version = ""
          channel = "stable"

          if input_version:
              version = input_version
              if input_channel:
                  channel = input_channel
              elif "-dev." in input_version:
                  channel = "dev"
              else:
                  channel = "stable"
          elif ref_name == "main":
              # Read closed version from CHANGELOG.md (e.g. ## v0.5.6 — 2026-08-29)
              text = open('CHANGELOG.md').read()
              match = re.search(r'^## v([0-9]+\.[0-9]+\.[0-9]+)\b', text, re.M)
              if match:
                  version = match.group(1)
              else:
                  sys.exit("Could not extract version from CHANGELOG.md for main release")
              channel = "stable"
          elif ref_name == "dev":
              # Next pre-release version: vX.Y.Z-dev.N
              text = open('CHANGELOG.md').read()
              match = re.search(r'^## v([0-9]+\.[0-9]+\.)([0-9]+)\b', text, re.M)
              if match:
                  prefix, patch = match.group(1), int(match.group(2))
                  next_base = f"{prefix}{patch + 1}"
              else:
                  next_base = "0.1.0"
              
              try:
                  last_tag = subprocess.check_output(
                      ['git', 'describe', '--tags', '--abbrev=0', '--match', 'v[0-9]*.[0-9]*.[0-9]*'],
                      text=True
                  ).strip()
                  rev_count = subprocess.check_output(
                      ['git', 'rev-list', '--count', f'{last_tag}..HEAD'],
                      text=True
                  ).strip()
                  count = max(1, int(rev_count))
              except Exception:
                  count = 1
              version = f"{next_base}-dev.{count}"
              channel = "dev"
          else:
              sys.exit(f"Unsupported ref for release: {ref_name}")

          print(f"Resolved Version: {version}")
          print(f"Resolved Channel: {channel}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version={version}\n")
              f.write(f"channel={channel}\n")
              if event_name == "push":
                  f.write("macos=true\n")
                  f.write("windows=true\n")
                  f.write("linux=true\n")
                  f.write("android=true\n")
                  f.write("publish=true\n")
              else:
                  f.write(f"macos=${{ inputs.macos == true || inputs.macos == 'true' || inputs.macos == '' }}\n")
                  f.write(f"windows=${{ inputs.windows == true || inputs.windows == 'true' || inputs.windows == '' }}\n")
                  f.write(f"linux=${{ inputs.linux == true || inputs.linux == 'true' || inputs.linux == '' }}\n")
                  f.write(f"android=${{ inputs.android == true || inputs.android == 'true' || inputs.android == '' }}\n")
                  f.write(f"publish=${{ inputs.publish == true || inputs.publish == 'true' || inputs.publish == '' }}\n")
          PY

  macos:
    name: macOS (.dmg)
    needs: [setup]
    if: needs.setup.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      - name: Build macOS release
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          flutter build macos --release \
            --build-name=${{ needs.setup.outputs.version }} \
            --build-number=$BUILD_NUMBER

      # Ad-hoc signed (CODE_SIGN_IDENTITY = "-"), so Gatekeeper quarantines this
      # on the receiving Mac; the release notes tell testers how to clear it. To
      # move to a notarized build later this is the only step that changes:
      # import a Developer ID cert, enable Hardened Runtime, then
      # `xcrun notarytool submit --wait` + `xcrun stapler staple` the .dmg.
      - name: Package .dmg
        run: |
          mkdir -p dist dmg-staging
          cp -R "build/macos/Build/Products/Release/flax.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "flax" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "dist/flax-${{ needs.setup.outputs.version }}-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  windows:
    name: Windows (.exe / .zip)
    needs: [setup]
    if: needs.setup.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Inno Setup path
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - run: flutter pub get

      - name: Build Windows release
        run: |
          $BUILD_NUMBER = (git rev-list --count HEAD)
          flutter build windows --release `
            --build-name=${{ needs.setup.outputs.version }} `
            --build-number=$BUILD_NUMBER

      - name: Package Windows installer and portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          
          # 1. Compile Inno Setup installer (.exe)
          iscc /DAppVersion="${{ needs.setup.outputs.version }}" packaging\windows\flax.iss

          # 2. Package portable .zip alongside installer
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath dist\flax-${{ needs.setup.outputs.version }}-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.zip

  android:
    name: Android (.apk)
    needs: [setup]
    if: needs.setup.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      # Recreate the gitignored signing material from secrets so the APK is
      # signed with the stable test key. Without this the Gradle config silently
      # falls back to the debug keystore and testers cannot upgrade in place.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLAX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FLAX_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::FLAX_KEYSTORE_BASE64 / FLAX_KEYSTORE_PASSWORD not set — refusing to ship a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/flax-test.jks
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEYSTORE_PASSWORD}
          keyAlias=flax-test
          storeFile=flax-test.jks
          EOF

      # A universal APK, not --split-per-abi: one file a tester can grab without
      # knowing their ABI, and not an .aab, which cannot be sideloaded.
      - name: Build release APK
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          flutter build apk --release \
            --build-name=${{ needs.setup.outputs.version }} \
            --build-number=$BUILD_NUMBER

      # Fail loudly rather than shipping an APK signed with the wrong key.
      - name: Verify signing identity
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          DN=$("$BT/apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | grep -m1 'certificate DN')
          echo "$DN"
          echo "$DN" | grep -q 'CN=flax test builds' \
            || { echo "::error::APK is not signed with the flax test key."; exit 1; }

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/flax-${{ needs.setup.outputs.version }}-android-universal.apk"

      - name: Scrub signing material
        if: always()
        run: rm -f android/flax-test.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  linux:
    name: Linux (.deb / .rpm / .tar.gz)
    needs: [setup]
    if: needs.setup.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # Remove slow/failing third-party repos and swap azure mirror for canonical Ubuntu mirror
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/google-chrome.list
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=10
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libkeybinder-3.0-dev \
            libmpv-dev \
            libpulse-dev \
            libasound2-dev \
            ruby-dev \
            rubygems-integration
          sudo gem install --no-document fpm

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      - name: Build Linux release
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          flutter build linux --release \
            --build-name=${{ needs.setup.outputs.version }} \
            --build-number=$BUILD_NUMBER

      - name: Package Linux artifacts (.deb, .rpm, .tar.gz)
        run: |
          packaging/linux/build_linux_packages.sh "${{ needs.setup.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: [setup, macos, windows, android, linux]
    # always() so that platforms left opted-out (skipped) don't block the
    # release, but a genuine build failure still does.
    if: |
      always() && needs.setup.outputs.publish == 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Require at least one artifact
        run: |
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::No artifacts were built — tick at least one platform, or untick publish."
            exit 1
          fi
          ls -lh dist/

      # The release body is the changelog's section for this version, followed
      # by the standing install instructions. Missing section is a hard failure for stable releases.
      - name: Extract changelog section
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          python3 - "$VERSION" <<'PY' > changelog.md
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md').read()
          # The section runs from its own heading to the next release heading.
          match = re.search(
              r'^## v%s\b.*?$(.*?)(?=^## |\Z)' % re.escape(version),
              text, re.S | re.M)
          if not match or not match.group(1).strip():
              # For dev builds, fall back to Unreleased if specific version tag is not yet closed off
              unreleased_match = re.search(r'^## Unreleased\b.*?$(.*?)(?=^## |\Z)', text, re.S | re.M)
              if unreleased_match and unreleased_match.group(1).strip():
                  print(unreleased_match.group(1).strip())
              else:
                  sys.exit(
                      'CHANGELOG.md has no content under "## v%s" or "## Unreleased".\n'
                      'Close the Unreleased section off before releasing: rename it '
                      'to "## v%s — <YYYY-MM-DD>" and open a fresh Unreleased above '
                      'it, in its own commit.' % (version, version))
          else:
              print(match.group(1).strip())
          PY
          echo "--- release notes ---"
          cat changelog.md

      - name: Prepare release body
        run: |
          cat changelog.md > body.md
          printf '\n\n---\n\nFor installation instructions, see the [README](https://github.com/neckbeard-io/flax#install-a-test-build).\n' >> body.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.setup.outputs.version }}
          CHANNEL: ${{ needs.setup.outputs.channel }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$CHANNEL" = "dev" ] || echo "$TAG" | grep -qi "dev"; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Creates the tag at this commit if it does not already exist.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading/replacing assets."
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            # Re-runs refresh the body too. Without this a release created from
            # an earlier commit keeps its old notes forever.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md $PRERELEASE_FLAG
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "flax $TAG" \
              --notes-file body.md \
              $PRERELEASE_FLAG \
              dist/*
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name'
