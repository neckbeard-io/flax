name: Release

# Manual release builds across macOS, Windows, and Android.
#
# Run it from the Actions tab ("Release" -> "Run workflow"), or:
#
#   gh workflow run release.yml -f version=0.4.1
#
# The `version` input is the whole version story: it becomes the build-name, the
# git tag (v<version>), and the release title. The workflow run number becomes
# the build-number so two builds of the same version stay distinguishable
# on-device. Nothing in pubspec.yaml is ever bumped.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, without the leading v (e.g. 0.4.1 or 0.4.1-dev.1)'
        required: true
        type: string
      channel:
        description: 'Release channel (stable or dev)'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - dev
      macos:
        description: 'Build macOS .dmg'
        required: false
        default: true
        type: boolean
      windows:
        description: 'Build Windows installer (.exe) & portable (.zip)'
        required: false
        default: true
        type: boolean
      android:
        description: 'Build Android .apk'
        required: false
        default: true
        type: boolean
      linux:
        description: 'Build Linux packages (.deb, .rpm, .tar.gz)'
        required: false
        default: true
        type: boolean
      publish:
        description: 'Create the tag + GitHub Release from whatever was built'
        required: false
        default: true
        type: boolean

permissions:
  contents: write # create the tag, the Release, and upload assets

# Two concurrent runs would race to create the same tag.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.2

jobs:
  macos:
    name: macOS (.dmg)
    if: inputs.macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      - name: Build macOS release
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          flutter build macos --release \
            --build-name=${{ inputs.version }} \
            --build-number=$BUILD_NUMBER

      # Ad-hoc signed (CODE_SIGN_IDENTITY = "-"), so Gatekeeper quarantines this
      # on the receiving Mac; the release notes tell testers how to clear it. To
      # move to a notarized build later this is the only step that changes:
      # import a Developer ID cert, enable Hardened Runtime, then
      # `xcrun notarytool submit --wait` + `xcrun stapler staple` the .dmg.
      - name: Package .dmg
        run: |
          mkdir -p dist dmg-staging
          cp -R "build/macos/Build/Products/Release/flax.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "flax" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "dist/flax-${{ inputs.version }}-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  windows:
    name: Windows (.exe / .zip)
    if: inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Inno Setup path
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - run: flutter pub get

      - name: Build Windows release
        run: |
          $BUILD_NUMBER = (git rev-list --count HEAD)
          flutter build windows --release `
            --build-name=${{ inputs.version }} `
            --build-number=$BUILD_NUMBER

      - name: Package Windows installer and portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          
          # 1. Compile Inno Setup installer (.exe)
          iscc /DAppVersion="${{ inputs.version }}" packaging\windows\flax.iss

          # 2. Package portable .zip alongside installer
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath dist\flax-${{ inputs.version }}-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.zip

  android:
    name: Android (.apk)
    if: inputs.android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      # Recreate the gitignored signing material from secrets so the APK is
      # signed with the stable test key. Without this the Gradle config silently
      # falls back to the debug keystore and testers cannot upgrade in place.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLAX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FLAX_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::FLAX_KEYSTORE_BASE64 / FLAX_KEYSTORE_PASSWORD not set — refusing to ship a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/flax-test.jks
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEYSTORE_PASSWORD}
          keyAlias=flax-test
          storeFile=flax-test.jks
          EOF

      # A universal APK, not --split-per-abi: one file a tester can grab without
      # knowing their ABI, and not an .aab, which cannot be sideloaded.
      - name: Build release APK
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          flutter build apk --release \
            --build-name=${{ inputs.version }} \
            --build-number=$BUILD_NUMBER

      # Fail loudly rather than shipping an APK signed with the wrong key.
      - name: Verify signing identity
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          DN=$("$BT/apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | grep -m1 'certificate DN')
          echo "$DN"
          echo "$DN" | grep -q 'CN=flax test builds' \
            || { echo "::error::APK is not signed with the flax test key."; exit 1; }

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/flax-${{ inputs.version }}-android-universal.apk"

      - name: Scrub signing material
        if: always()
        run: rm -f android/flax-test.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  linux:
    name: Linux (.deb / .rpm / .tar.gz)
    if: inputs.linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # Remove slow/failing third-party repos and swap azure mirror for canonical Ubuntu mirror
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/google-chrome.list
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=10
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libkeybinder-3.0-dev \
            libmpv-dev \
            libpulse-dev \
            libasound2-dev \
            ruby-dev \
            rubygems-integration
          sudo gem install --no-document fpm

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      - name: Build Linux release
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          flutter build linux --release \
            --build-name=${{ inputs.version }} \
            --build-number=$BUILD_NUMBER

      - name: Package Linux artifacts (.deb, .rpm, .tar.gz)
        run: |
          packaging/linux/build_linux_packages.sh "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: [macos, windows, android, linux]
    # always() so that platforms left opted-out (skipped) don't block the
    # release, but a genuine build failure still does.
    if: |
      always() && inputs.publish
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Require at least one artifact
        run: |
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::No artifacts were built — tick at least one platform, or untick publish."
            exit 1
          fi
          ls -lh dist/

      # The release body is the changelog's section for this version, followed
      # by the standing install instructions. Extracting it here is what stops
      # the body silently reverting to install-notes-only — which is what every
      # The release body is the changelog's section for this version, followed
      # by the standing install instructions. Missing section is a hard failure for stable releases.
      - name: Extract changelog section
        run: |
          VERSION="${{ inputs.version }}"
          python3 - "$VERSION" <<'PY' > changelog.md
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md').read()
          # The section runs from its own heading to the next release heading.
          match = re.search(
              r'^## v%s\b.*?$(.*?)(?=^## |\Z)' % re.escape(version),
              text, re.S | re.M)
          if not match or not match.group(1).strip():
              # For dev builds, fall back to Unreleased if specific version tag is not yet closed off
              unreleased_match = re.search(r'^## Unreleased\b.*?$(.*?)(?=^## |\Z)', text, re.S | re.M)
              if unreleased_match and unreleased_match.group(1).strip():
                  print(unreleased_match.group(1).strip())
              else:
                  sys.exit(
                      'CHANGELOG.md has no content under "## v%s" or "## Unreleased".\n'
                      'Close the Unreleased section off before releasing: rename it '
                      'to "## v%s — <YYYY-MM-DD>" and open a fresh Unreleased above '
                      'it, in its own commit.' % (version, version))
          else:
              print(match.group(1).strip())
          PY
          echo "--- release notes ---"
          cat changelog.md

      - name: Prepare release body
        run: |
          cat changelog.md > body.md
          printf '\n\n---\n\nFor installation instructions, see the [README](https://github.com/neckbeard-io/flax#install-a-test-build).\n' >> body.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$CHANNEL" = "dev" ] || echo "$TAG" | grep -qi "dev"; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Creates the tag at this commit if it does not already exist.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading/replacing assets."
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            # Re-runs refresh the body too. Without this a release created from
            # an earlier commit keeps its old notes forever.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md $PRERELEASE_FLAG
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "flax $TAG" \
              --notes-file body.md \
              $PRERELEASE_FLAG \
              dist/*
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name'
