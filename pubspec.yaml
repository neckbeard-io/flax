name: flax
description: "High-fidelity music player with parametric EQ, AutoEQ, and Navidrome support."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Local database
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Audio engine
  mpv_audio_kit: ^0.4.2

  # Theming
  dynamic_color: ^1.7.0

  # Images
  cached_network_image: ^3.4.1
  # Already pulled in by cached_network_image; declared directly because
  # lib/shared/widgets/art_cache.dart configures the cache rather than taking
  # the 200-object default.
  flutter_cache_manager: ^3.4.1
  palette_generator: ^0.3.3+4

  # Auth
  crypto: ^3.0.6

  # Archive extraction
  archive: ^4.0.2

  # Utils
  collection: ^1.19.1
  intl: ^0.19.0
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  package_info_plus: ^10.2.1
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  country_flags: ^4.1.2
  meta: ^1.15.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file: ^7.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.34.5
  # freezed, json_serializable and riverpod_generator were declared but never
  # used — nothing in lib/ or test/ carries their annotations. They are removed
  # rather than left dormant because they are not free: every builder joins the
  # build_runner graph and analyzes all 130 inputs, and riverpod_generator 2.6
  # pins analyzer 3.9, which cannot parse the dot-shorthand syntax a dependency
  # now uses under Dart 3.12 — it crashed the build outright with "Missing
  # implementation of visitDotShorthandInvocation". Re-add whichever one is
  # actually adopted, at a version that supports the pinned SDK.
  mockito: ^5.4.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/autoeq/
    - assets/flax_logo.svg
    - assets/flax.png
