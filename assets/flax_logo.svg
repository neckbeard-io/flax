<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C9DED"/>
      <stop offset="100%" style="stop-color:#4A6CF7"/>
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93B1F5"/>
      <stop offset="100%" style="stop-color:#5B7DF2"/>
    </linearGradient>
  </defs>
  <!-- Five petals arranged in a circle -->
  <g transform="translate(256,240)">
    <!-- Petal 1 - top -->
    <ellipse cx="0" cy="-75" rx="42" ry="72" fill="url(#petalGrad)" opacity="0.95" transform="rotate(0)"/>
    <!-- Petal 2 -->
    <ellipse cx="0" cy="-75" rx="42" ry="72" fill="url(#petalGrad2)" opacity="0.9" transform="rotate(72)"/>
    <!-- Petal 3 -->
    <ellipse cx="0" cy="-75" rx="42" ry="72" fill="url(#petalGrad)" opacity="0.85" transform="rotate(144)"/>
    <!-- Petal 4 -->
    <ellipse cx="0" cy="-75" rx="42" ry="72" fill="url(#petalGrad2)" opacity="0.9" transform="rotate(216)"/>
    <!-- Petal 5 -->
    <ellipse cx="0" cy="-75" rx="42" ry="72" fill="url(#petalGrad)" opacity="0.95" transform="rotate(288)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="18" fill="#E8D44D" opacity="0.95"/>
    <circle cx="0" cy="0" r="10" fill="#D4A017" opacity="0.7"/>
  </g>
  <!-- Stem -->
  <path d="M256 290 Q256 380 248 440 Q244 470 256 480" stroke="#5CAD5C" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Leaves -->
  <path d="M252 360 Q220 340 200 355 Q225 360 250 370" fill="#6BC06B" opacity="0.85"/>
  <path d="M254 400 Q285 375 305 388 Q280 390 258 405" fill="#6BC06B" opacity="0.85"/>
</svg>
